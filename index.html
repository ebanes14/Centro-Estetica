const xe=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function colN(i){let s="";for(i+=1;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s}

function zipBlob(files){const te=new TextEncoder(),T=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}

  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);

const PUB=window.PUB_KEY||null;
const TRIAL=7;

 if(!lic||!lic.id){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(6));lic={id:[...r].map(x=>A[x%32]).join(""),inst:t,until:null,seen:t};licSave()}}

const isLocked=()=>!!(lockMsg||left()<0);

async function activate(tok){const m=$("#lm"),say=t=>{if(m)m.textContent=t;else alert(t)};
 try{const p=String(tok).trim().split(".");if(p.length!==3)throw"Clave inválida";const[id,u,sg]=p;
  if(id!==lic.id)throw"Esta clave es de otro dispositivo";

  const k=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
  if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,b64(sg),new TextEncoder().encode(id+"."+u)))throw"Clave inválida";

 }catch(e){say(typeof e==="string"?e:"Clave inválida")}}

function conflict(stf,date,s,d,ig){const x=db.turnos.find(x=>x.id!==ig&&x.stf===stf&&x.date===date&&x.s!=="can"&&x.s!=="nos"&&tm(x.time)<s+d&&tm(x.time)+x.dur>s);if(x)return"Ese profesional ya tiene un turno a las "+x.time+".";

function agenda(){const S=db.staff,day=db.turnos.filter(t=>t.date===sel&&(!fs||t.stf===fs));let lo=1440,hi=0;(fs?S.filter(x=>x.id===fs):S).forEach(x=>{lo=Math.min(lo,tm(x.from));hi=Math.max(hi,tm(x.to))});if(lo>=hi){lo=480;hi=1200}

const del=(k,id)=>{if(confirm("¿Eliminar? Los turnos ya cargados no se borran.")){db[k]=db[k].filter(x=>x.id!==id);rf()}},ed=(f,id)=>`<div><button class="b s w" onclick="${f}('${id}')">Editar</button> <button class="b s w" onclick="del('${f==="svForm"?"services":f==="stForm"?"staff":"blocks"}','${id}')">✕</button></div>`;
function svForm(id){const x=db.services.find(s=>s.id===id)||{};form(id?"Editar servicio":"Nuevo servicio",[{k:"n",l:"Tratamiento",v:x.name},{k:"p",l:"Precio",t:"number",v:x.price},{k:"d",l:"Duración (minutos)",t:"number",v:x.dur}],v=>{const p=parseFloat(v.p),d=parseInt(v.d);if(!v.n||isNaN(p)||!(d>0)){alert("Completá nombre, precio y duración");return false}const o={name:v.n,price:p,dur:d,stf:ckv()};if(id)Object.assign(x,o);else db.services.push({id:uid(),...o})});boxes("Profesionales que lo realizan (ninguno = todos)",db.staff.map(s=>[s.id,s.name]),x.stf||[])}
function stForm(id){const x=db.staff.find(s=>s.id===id)||{};form(id?"Editar profesional":"Nuevo profesional",[{k:"n",l:"Nombre",v:x.name},{k:"c",l:"Comisión (%)",t:"number",v:x.comm},{k:"f",l:"Desde",t:"time",v:x.from||"09:00"},{k:"h",l:"Hasta",t:"time",v:x.to||"18:00"}],v=>{if(!v.n){alert("Completá el nombre");return false}const o={name:v.n,comm:parseFloat(v.c)||0,from:v.f||"09:00",to:v.h||"18:00",days:ckv().map(Number)};if(id)Object.assign(x,o);else db.staff.push({id:uid(),...o})});boxes("Días de atención",DAYS,x.days||[1,2,3,4,5])}
function blForm(){form("Bloquear horario",[{k:"d",l:"Fecha",t:"date",v:sel},{k:"f",l:"Desde",t:"time",v:"09:00"},{k:"h",l:"Hasta",t:"time",v:"20:00"},{k:"s",l:"Profesional",o:[["","Todos"],...db.staff.map(s=>[s.id,s.name])]},{k:"w",l:"Motivo (descanso, feriado, capacitación)"}],v=>{if(!v.d||tm(v.h)<=tm(v.f)){alert("Revisá fecha y horas");return false}db.blocks.push({id:uid(),date:v.d,from:v.f,to:v.h,stf:v.s,why:v.w})})}
function equipo(){const[y,m]=cmo.split("-").map(Number),mv=n=>{const d=new Date(y,m-1+n,1);cmo=iso(d).slice(0,7);render()};window.mv=mv;
 const com=db.staff.map(s=>{const T=db.turnos.filter(t=>t.stf===s.id&&t.s==="ok"&&t.date.startsWith(cmo)),b=T.reduce((a,t)=>a+t.price,0);return`<div class="c"><div class="row"><b>${esc(s.name)}</b><b class="grn">${money(b*(s.comm||0)/100)}</b></div><div class="mu">${T.length} atenciones · ${money(b)} · ${s.comm||0}%</div></div>`}).join("");
 return`<h1>Servicios y equipo</h1><h2>Servicios</h2><div class="c"><button class="b" onclick="svForm()">+ Agregar servicio</button>${db.services.map(x=>`<div class="row" style="margin-top:10px"><div><b>${esc(x.name)}</b><div class="mu">${money(x.price)} · ${x.dur} min · ${x.stf&&x.stf.length?x.stf.map(i=>esc(st(i).name)).join(", "):"Todos"}</div></div>${ed("svForm",x.id)}</div>`).join("")}</div>
 <h2>Profesionales</h2><div class="c"><button class="b" onclick="stForm()">+ Agregar profesional</button>${db.staff.map(x=>`<div class="row" style="margin-top:10px"><div><b>${esc(x.name)}</b><div class="mu">${x.from} a ${x.to} · ${(x.days||[]).map(d=>DAYS.find(z=>z[0]===d)[1]).join(" ")} · ${x.comm||0}%</div></div>${ed("stForm",x.id)}</div>`).join("")}</div>
 <h2>Bloqueos de horario</h2><div class="c"><button class="b" onclick="blForm()">+ Bloquear horario</button>${db.blocks.filter(b=>b.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`<div class="row" style="margin-top:10px"><div><b>${fd(b.date)} ${b.from}-${b.to}</b><div class="mu">${esc(b.why||"Bloqueado")} · ${b.stf?esc(st(b.stf).name):"Todos"}</div></div><button class="b s w" onclick="del('blocks','${b.id}')">✕</button></div>`).join("")}</div>
 <h2>Comisiones del mes</h2><div class="row" style="margin-bottom:8px"><button class="b s w" onclick="mv(-1)">‹</button><b>${cmo}</b><button class="b s w" onclick="mv(1)">›</button></div>${com||'<p class="mu">Cargá profesionales para ver sus comisiones.</p>'}`}
// ---------- DATOS ----------
const backup=()=>dl("estetica-copia-"+today()+".json",JSON.stringify({version:1,fecha:today(),db})).then(ok=>{if(ok){db.cfg.lastBackup=today();rf()}});
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.db||!x.db.clients)throw 0;if(!confirm("Se reemplazarán TODOS los datos actuales por los de la copia ("+x.db.clients.length+" clientes). ¿Continuar?"))return;db=Object.assign({clients:[],turnos:[],movs:[],services:[],staff:[],blocks:[],packs:[],cfg:{name:"Centro de estética"}},x.db);rf();alert("Copia restaurada")}catch(e){alert("El archivo no es una copia válida")}};r.readAsText(f);inp.value=""}
function datos(){return`<h1>Datos</h1><div class="c mu">${db.clients.length} clientes · ${db.turnos.length} turnos · ${db.movs.length} movimientos</div><h2>Mi centro</h2><div class="c row"><b>${esc(db.cfg.name)}</b><button class="b s w" onclick="form('Nombre del centro',[{k:'n',l:'Nombre',v:db.cfg.name}],v=>{if(!v.n)return false;db.cfg.name=v.n})">Cambiar</button></div>
 <h2>Licencia</h2><div class="c"><div class="row"><span class="mu">Código de cliente</span><b>${lic.id}</b></div>${PUB?`<div class="row" style="margin-top:6px"><span class="mu">${left()>=0?"Activa hasta":"Venció el"}</span><b>${fd(validUntil())}</b></div><div class="row" style="margin-top:6px"><span class="mu">Días restantes</span><b class="${left()<=5?"red":"grn"}">${Math.max(0,left())}</b></div><button class="b s" style="margin-top:10px" onclick="renewForm()">Ingresar clave de renovación</button>`:""}<p class="mu" style="margin-bottom:0">Los primeros ${TRIAL} días son de prueba gratis.</p></div>
 <h2>Copia de seguridad</h2><div class="c"><p class="mu" style="margin-top:0">Incluye clientas, fichas, fotos, turnos, caja y configuración.<br><b>${db.cfg.lastBackup?"Última copia: "+fd(db.cfg.lastBackup):"Todavía no hiciste ninguna copia."}</b></p><button class="b" onclick="backup()">Descargar copia completa</button></div><div class="c"><p class="mu" style="margin-top:0">Para recuperar todo en otro celular, elegí acá tu archivo de copia (la licencia es por celular y necesita clave nueva).</p><input type="file" accept=".json,application/json" onchange="restore(this)"></div>`}
function render(){if(!ready){$("#app").innerHTML='<p class="mu" style="text-align:center;margin-top:40vh">Cargando…</p>';return}
 licTick();if(PUB&&isLocked()){$("#nav").innerHTML="";$("#app").innerHTML=lockHtml();return}
 $("#app").innerHTML=banner()+{ag:agenda,cli:clients,caja,eq:equipo,dat:datos}[tab]()+`<p class="mu" id="st" style="text-align:center;margin-top:18px">${status}</p>`;
 $("#nav").innerHTML=tabs.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';openC=null;render();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join("")}
licInit();render();load();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script></body></html>
